name: Package Footprint

on:
  push:
    branches: [ master ]
    paths:
      - 'Apps/Electron/**'
      - 'Apps/Host/**'
      - 'Apps/Windows/**'
      - 'Libraries/Device/**'
      - 'Libraries/Abstractions/**'
      - 'Libraries/Automation/**'
      - 'Libraries/Macro/**'
      - 'Libraries/Shared/**'
      - 'Apps/NetworkProxy/**'
      - 'Platforms/Linux/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Scripts/Prune-ShippingFootprint.ps1'
      - 'Scripts/Build-*Installer.ps1'
      - '.github/workflows/package-footprint.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'Apps/Electron/**'
      - 'Apps/Host/**'
      - 'Apps/Windows/**'
      - 'Libraries/Device/**'
      - 'Libraries/Abstractions/**'
      - 'Libraries/Automation/**'
      - 'Libraries/Macro/**'
      - 'Libraries/Shared/**'
      - 'Apps/NetworkProxy/**'
      - 'Platforms/Linux/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Scripts/Prune-ShippingFootprint.ps1'
      - 'Scripts/Build-*Installer.ps1'
      - '.github/workflows/package-footprint.yml'
  workflow_dispatch:

jobs:
  package-footprint:
    name: ${{ matrix.os }} (${{ matrix.runtimeIdentifier }}) package footprint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            runtimeIdentifier: win-x64
            electronPlatform: --win
            electronTargets: dir
            electronArchitecture: --x64
          - os: ubuntu-24.04
            platform: linux
            runtimeIdentifier: linux-x64
            electronPlatform: --linux
            electronTargets: AppImage deb
            electronArchitecture: --x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Apps/Electron/package-lock.json

      - name: Install Electron build dependencies
        working-directory: Apps/Electron
        run: npm ci

      - name: Publish and prune self-contained Host (${{ matrix.runtimeIdentifier }})
        shell: pwsh
        run: |
          $expectedArchitecture = if ('${{ matrix.runtimeIdentifier }}' -like '*arm64') { 'Arm64' } else { 'X64' }
          $actualArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($actualArchitecture -ne $expectedArchitecture) {
            throw "Runner architecture '$actualArchitecture' does not match '${{ matrix.runtimeIdentifier }}'."
          }

          $env:UDT_PLATFORM = '${{ matrix.platform }}'
          $project = 'Apps/Host/UniversalDeviceToolkit.Host.csproj'
          $publishPath = Join-Path $PWD 'Apps/Host/publish/${{ matrix.runtimeIdentifier }}'
          dotnet restore $project --runtime '${{ matrix.runtimeIdentifier }}' --force-evaluate
          if ($LASTEXITCODE -ne 0) { throw 'Host restore failed.' }
          dotnet publish $project --configuration Release --runtime '${{ matrix.runtimeIdentifier }}' --self-contained true --no-restore --output $publishPath
          if ($LASTEXITCODE -ne 0) { throw 'Host publish failed.' }
          ./Scripts/Prune-ShippingFootprint.ps1 -PayloadPath $publishPath -RuntimeIdentifier '${{ matrix.runtimeIdentifier }}' -AllowedCultures 'ar;bg;cs;de;el;en;es;fr;hu;it;ja;lv;nl-nl;pl;pt;pt-br;ro;ru;sk;tr;uk;uz-latn-uz;vi;zh-hans;zh-hant'

      - name: Smoke Host JSON-RPC
        shell: pwsh
        run: |
          $hostName = if ('${{ runner.os }}' -eq 'Windows') { 'UniversalDeviceToolkit.Host.exe' } else { 'UniversalDeviceToolkit.Host' }
          $hostPath = Join-Path $PWD "Apps/Host/publish/${{ matrix.runtimeIdentifier }}/$hostName"
          if (-not (Test-Path -LiteralPath $hostPath -PathType Leaf)) {
            throw "Published Host executable is missing: $hostPath"
          }
          node Apps/Electron/scripts/smoke-host.mjs $hostPath

      - name: Build and package Electron product
        working-directory: Apps/Electron
        shell: pwsh
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'Electron lint failed.' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Electron typecheck failed.' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Electron tests failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Electron production build failed.' }
          if ('${{ runner.os }}' -eq 'Windows') {
            node scripts/build-windows-installer.mjs --use-published-host --output-directory dist/windows
            if ($LASTEXITCODE -ne 0) { throw 'WebView2 packaging failed.' }
            node scripts/build-compatibility-installer.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Compatibility packaging failed.' }
            return
          }
          $arguments = @('--config', 'electron-builder.yml', '${{ matrix.electronPlatform }}')
          $arguments += '${{ matrix.electronTargets }}' -split ' '
          $arguments += @('${{ matrix.electronArchitecture }}', '--publish', 'never')
          & npx electron-builder @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Electron package build failed.' }

      - name: Enforce distributable budgets
        working-directory: Apps/Electron
        shell: pwsh
        run: |
          $directories = if ('${{ runner.os }}' -eq 'Windows') { @('dist/windows', 'dist/compatibility') } else { @('dist') }
          $artifacts = @($directories | ForEach-Object { Get-ChildItem -LiteralPath $_ -File } | Where-Object { $_.Extension -in @('.exe', '.zip', '.AppImage', '.deb') })
          if ($artifacts.Count -eq 0) { throw 'Electron Builder produced no distributable artifacts.' }
          node scripts/package-footprint.mjs @($artifacts.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Distributable footprint audit failed.' }

      - name: Upload footprint reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-footprint-${{ matrix.runtimeIdentifier }}-${{ github.run_id }}
          path: Apps/Electron/dist/**/footprint/**/*.json
          if-no-files-found: warn
