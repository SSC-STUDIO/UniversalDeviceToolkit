name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: Apps/Electron/package-lock.json
    - name: Restore Electron build tools
      working-directory: Apps/Electron
      run: npm ci
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
    - name: Build
      run: .\Make.bat
    - name: Verify both Windows installers and replacement ownership
      shell: pwsh
      run: |
        [xml]$properties = Get-Content -Raw Directory.Build.props
        $versionProperties = $properties.Project.PropertyGroup | Select-Object -First 1
        $version = "$($versionProperties.MajorVersion).$($versionProperties.MinorVersion).$($versionProperties.PatchVersion)"
        ./Scripts/Test-WindowsDualInstallers.ps1 `
          -WebView2Installer "BuildInstaller/UniversalDeviceToolkitWebView2Setup-$version.exe" `
          -CompatibilityInstaller "BuildInstaller/UniversalDeviceToolkitCompatibilitySetup-$version.exe" `
          -HashManifest "release-assets/UniversalDeviceToolkit_v${version}_SHA256.txt"
    - name: Upload installer verification results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: windows-installer-verification
        path: TestResults/dual-installers/verification.json
        if-no-files-found: warn
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: release-assets
        path: release-assets/
