name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag to rebuild (used for recovery or a deliberate manual release)"
        required: true
        type: string
      source_ref:
        description: "Optional source branch or commit for a recovery rebuild"
        required: false
        type: string
      skip_tests:
        description: "Skip the release test gate only for an explicitly approved recovery run"
        required: true
        default: false
        type: boolean
      skip_signing:
        description: "Skip Azure signing only for an explicitly approved recovery run"
        required: true
        default: false
        type: boolean

jobs:
  build:
    permissions:
      contents: write

    runs-on: windows-2022
    env:
      BUILD_OUTPUT: Build
      ONLINE_BUILD_OUTPUT: Build-English
      # Self-contained .NET Host payload embedded by the Electron installer via
      # extraResources (Apps/Electron/electron-builder.yml).
      HOST_BUILD_OUTPUT: Apps/Host/publish/win-x64
      INSTALLER_OUTPUT: BuildInstaller
      INSTALLER_PAYLOAD_OUTPUT: BuildInstallerPayload
      RELEASE_OUTPUT: release-assets
      PAGES_OUTPUT: release-assets/pages

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ inputs.source_ref || inputs.release_tag || github.ref }}
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: Apps/Electron/package-lock.json
    - name: Restore Electron build tools
      working-directory: Apps/Electron
      run: npm ci
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Resolve release version
      shell: pwsh
      run: |
        [xml]$props = Get-Content -Raw 'Directory.Build.props'
        $group = $props.Project.PropertyGroup | Select-Object -First 1

        $requestedReleaseTag = "${{ inputs.release_tag }}".Trim()
        $releaseRefName = if ($requestedReleaseTag) { $requestedReleaseTag } else { "${{ github.ref_name }}" }
        $isManualRelease = [bool]$requestedReleaseTag
        $skipTests = $isManualRelease -and ("${{ inputs.skip_tests }}".Trim().ToLowerInvariant() -eq 'true')
        $skipSigning = $isManualRelease -and ("${{ inputs.skip_signing }}".Trim().ToLowerInvariant() -eq 'true')

        $releaseVersion = [string]$group.ReleaseVersion
        if ([string]::IsNullOrWhiteSpace($releaseVersion) -or $releaseVersion -match '\$\(') {
          $majorVersion = [string]$group.MajorVersion
          $minorVersion = [string]$group.MinorVersion
          $patchVersion = [string]$group.PatchVersion

          if ([string]::IsNullOrWhiteSpace($majorVersion) -or [string]::IsNullOrWhiteSpace($minorVersion) -or [string]::IsNullOrWhiteSpace($patchVersion)) {
            throw 'Could not resolve release version from Directory.Build.props.'
          }

          $releaseVersion = "$majorVersion.$minorVersion.$patchVersion"
        }

        $tagVersion = $releaseRefName -replace '^v', ''
        $normalizedTagVersion = if ($tagVersion -match '^(\d+\.\d+\.\d+)') { $Matches[1] } else { $tagVersion }
        if ($normalizedTagVersion -ne $releaseVersion) {
          throw "Git tag version '$tagVersion' does not match Directory.Build.props version '$releaseVersion'."
        }

        $versionLabel = if ($tagVersion -match '-') { $tagVersion } else { $releaseVersion }
        $majorVersionNumber = [int]($releaseVersion.Split('.')[0])
        $includeCrossPlatformCli = $majorVersionNumber -ge 5
        $isPrerelease = $releaseRefName -match '-'
        "VERSION=$versionLabel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "BUILD_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "RELEASE_TAG=$releaseRefName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "RELEASE_IS_MANUAL=$($isManualRelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "RELEASE_IS_PRERELEASE=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "RELEASE_SKIP_TESTS=$($skipTests.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "RELEASE_SKIP_SIGNING=$($skipSigning.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "ENABLE_CROSS_PLATFORM_CLI=$($includeCrossPlatformCli.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "SETUP_FULL_ASSET=UniversalDeviceToolkit_v$versionLabel" + "_Full_Setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "SETUP_ONLINE_ASSET=UniversalDeviceToolkit_v$versionLabel" + "_Online_Setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "ZIP_FULL_ASSET=UniversalDeviceToolkit_v$versionLabel" + "_Full_win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "ZIP_ONLINE_ASSET=UniversalDeviceToolkit_v$versionLabel" + "_Online_win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        if ($includeCrossPlatformCli) {
          "CLI_CROSS_PLATFORM_ASSET=UniversalDeviceToolkit_v$versionLabel" + "_CLI_cross-platform.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }
        "HASH_ASSET=UniversalDeviceToolkit_v$versionLabel" + "_SHA256.txt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Restore solution
      shell: pwsh
      run: |
        if ($env:RELEASE_IS_MANUAL -eq 'true') {
          # Manual recovery runs may rebuild a historical tag whose lock file
          # predates project-reference changes already present in that tag.
          dotnet restore UniversalDeviceToolkit.sln --force-evaluate
        }
        else {
          dotnet restore UniversalDeviceToolkit.sln --locked-mode
        }

        if ($LASTEXITCODE -ne 0) {
          throw 'Solution restore failed.'
        }

    - name: Build main solution
      run: dotnet build UniversalDeviceToolkit.sln --configuration Release --no-restore -m:1 --disable-build-servers

    - name: Record skipped release test gate
      if: ${{ env.RELEASE_SKIP_TESTS == 'true' }}
      shell: pwsh
      run: Write-Warning 'The release test gate was explicitly skipped for this manual migration recovery run.'

    - name: Record skipped signing gate
      if: ${{ env.RELEASE_SKIP_SIGNING == 'true' }}
      shell: pwsh
      run: Write-Warning 'Azure signing was explicitly skipped for this manual migration recovery run because signing secrets are not configured.'

    - name: Test (Contracts)
      if: ${{ env.RELEASE_SKIP_TESTS != 'true' }}
      run: dotnet test Tests/Contracts/UniversalDeviceToolkit.Tests.Contracts.csproj --framework net10.0-windows10.0.26100.0 --configuration Release --no-build --logger "trx;LogFileName=UniversalDeviceToolkit.Release.Contracts.trx"

    - name: Test (Fast unit tests)
      if: ${{ env.RELEASE_SKIP_TESTS != 'true' }}
      run: dotnet test Tests/Fast/UniversalDeviceToolkit.Fast.Tests.csproj --framework net10.0-windows10.0.26100.0 --configuration Release --no-build --logger "trx;LogFileName=UniversalDeviceToolkit.Release.Fast.trx"

    - name: Test (Unit)
      if: ${{ env.RELEASE_SKIP_TESTS != 'true' }}
      run: dotnet test Tests/Unit/UniversalDeviceToolkit.Tests.csproj --framework net10.0-windows10.0.26100.0 --configuration Release --no-build --logger "trx;LogFileName=UniversalDeviceToolkit.Release.Tests.trx" --collect:"XPlat Code Coverage" --settings Tests/Unit/coverlet.runsettings

    - name: Test (Stateful)
      if: ${{ env.RELEASE_SKIP_TESTS != 'true' }}
      run: dotnet test Tests/Stateful/UniversalDeviceToolkit.Tests.Stateful.csproj --framework net10.0-windows10.0.26100.0 --configuration Release --no-build --logger "trx;LogFileName=UniversalDeviceToolkit.Release.Stateful.trx"

    - name: Upload release test coverage
      uses: actions/upload-artifact@v7
      if: ${{ always() && env.RELEASE_SKIP_TESTS != 'true' }}
      with:
        name: release-test-coverage-${{ github.run_id }}
        path: '**/*coverage.cobertura.xml'
        if-no-files-found: warn

    - name: Publish release payload
      shell: pwsh
      run: |
        Remove-Item -Recurse -Force $env:BUILD_OUTPUT, $env:ONLINE_BUILD_OUTPUT, $env:INSTALLER_OUTPUT, $env:RELEASE_OUTPUT, $env:PAGES_OUTPUT -ErrorAction SilentlyContinue

        # FileVersion stays numeric (6.1.1). Version/InformationalVersion keep the
        # full SemVer so a v6.1.1-preview.1 tag does not ship a stable 6.1.1 Host.
        dotnet publish Apps/CLI/UniversalDeviceToolkit.CLI.csproj --configuration Release --output $env:BUILD_OUTPUT /p:DebugType=None /p:FileVersion=$env:BUILD_VERSION /p:Version=$env:VERSION
        if ($LASTEXITCODE -ne 0) { throw "CLI publish failed." }

        dotnet publish Apps/NetworkProxy/UniversalDeviceToolkit.NetworkProxy.csproj --configuration Release --output $env:BUILD_OUTPUT /p:DebugType=None /p:FileVersion=$env:BUILD_VERSION /p:Version=$env:VERSION
        if ($LASTEXITCODE -ne 0) { throw "NetworkProxy publish failed." }

        $prunePaths = @(
          (Join-Path $env:BUILD_OUTPUT 'x86'),
          (Join-Path $env:BUILD_OUTPUT 'arm64'),
          # POSIX-only LibreHardwareMonitor helpers are never P/Invoked on Windows;
          # dropping them keeps the installer lean without touching any Windows path.
          (Join-Path $env:BUILD_OUTPUT 'libMonoPosixHelper.dll'),
          (Join-Path $env:BUILD_OUTPUT 'Mono.Posix.NETStandard.dll')
        )

        foreach ($path in $prunePaths) {
          if (Test-Path $path) {
            Remove-Item -Recurse -Force $path
          }
        }

        ./Scripts/Prune-ShippingFootprint.ps1 -PayloadPath $env:BUILD_OUTPUT

        # Publish the self-contained .NET host that the Electron app embeds via
        # extraResources (Apps/Electron/electron-builder.yml).
        Remove-Item -Recurse -Force $env:HOST_BUILD_OUTPUT -ErrorAction SilentlyContinue
        dotnet publish Apps/Host/UniversalDeviceToolkit.Host.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          --output $env:HOST_BUILD_OUTPUT `
          /p:DebugType=None /p:FileVersion=$env:BUILD_VERSION /p:Version=$env:VERSION
        if ($LASTEXITCODE -ne 0) { throw "Host publish failed." }

        # Keep every supported satellite culture in the Host publish until
        # Build-LanguageAssets has created the per-culture archives; the
        # English-only prune for the Online payload happens later inside
        # Build-ElectronInstaller.ps1.
        ./Scripts/Prune-ShippingFootprint.ps1 `
          -PayloadPath $env:HOST_BUILD_OUTPUT `
          -AllowedCultures 'ar;bg;cs;de;el;en;es;fr;hu;it;ja;lv;nl-nl;pl;pt;pt-br;ro;ru;sk;tr;uk;uz-latn-uz;vi;zh-hans;zh-hant'

    - name: Assert shipping payload
      shell: pwsh
      run: |
        ./Scripts/Assert-ShippingPayload.ps1 -PayloadPath $env:BUILD_OUTPUT

    - name: Sign Host payload
      if: ${{ env.RELEASE_SKIP_SIGNING != 'true' }}
      uses: azure/trusted-signing-action@v0.5
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        files-folder: ${{ env.HOST_BUILD_OUTPUT }}
        files-folder-filter: exe,dll
        files-folder-recurse: true

    - name: Verify Host payload signatures
      if: ${{ env.RELEASE_SKIP_SIGNING != 'true' }}
      shell: pwsh
      run: ./Scripts/Assert-AuthenticodeSignatures.ps1 -Path $env:HOST_BUILD_OUTPUT

    - name: Sign release payload
      if: ${{ env.RELEASE_SKIP_SIGNING != 'true' }}
      uses: azure/trusted-signing-action@v0.5
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        files-folder: ${{ env.BUILD_OUTPUT }}
        files-folder-filter: exe,dll
        files-folder-recurse: true

    - name: Verify release payload signatures
      if: ${{ env.RELEASE_SKIP_SIGNING != 'true' }}
      shell: pwsh
      run: ./Scripts/Assert-AuthenticodeSignatures.ps1 -Path $env:BUILD_OUTPUT

    - name: Smoke CLI help and version
      shell: pwsh
      run: |
        $cliExePath = Join-Path $PWD "$env:BUILD_OUTPUT\udt.exe"
        $cliDllPath = Join-Path $PWD "$env:BUILD_OUTPUT\udt.dll"
        if (-not (Test-Path $cliExePath)) {
          throw "CLI executable not found at $cliExePath"
        }
        if (-not (Test-Path $cliDllPath)) {
          throw "CLI assembly not found at $cliDllPath"
        }
        # One-train shim: old scripts still call udt-cli.*
        $shimExe = Join-Path $PWD "$env:BUILD_OUTPUT\udt-cli.exe"
        $shimDll = Join-Path $PWD "$env:BUILD_OUTPUT\udt-cli.dll"
        if (-not (Test-Path $shimExe)) { Copy-Item -LiteralPath $cliExePath -Destination $shimExe }
        if (-not (Test-Path $shimDll)) { Copy-Item -LiteralPath $cliDllPath -Destination $shimDll }

        $help = (& dotnet $cliDllPath --help 2>&1 | Out-String).Trim()
        if ($LASTEXITCODE -ne 0) {
          throw "CLI help failed with exit code $LASTEXITCODE`n$help"
        }
        if ($help -notmatch 'Usage:' -or $help -notmatch 'Commands:') {
          throw "CLI help output missing expected sections.`n$help"
        }

        $version = (& dotnet $cliDllPath --version 2>&1 | Out-String).Trim()
        if ($LASTEXITCODE -ne 0) {
          throw "CLI version failed with exit code $LASTEXITCODE`n$version"
        }
        if (-not $version.StartsWith($env:VERSION) -and -not $version.StartsWith($env:BUILD_VERSION)) {
          throw "CLI version '$version' does not start with expected '$env:VERSION'."
        }

    - name: Prepare release and Pages resources
      shell: pwsh
      run: |
        # Language packs are archived from the Host publish culture satellites,
        # so this must run before Build-ElectronInstaller.ps1 prunes the Host
        # payload to English for the Online installer.
        ./Scripts/Build-LanguageAssets.ps1 -BuildDir $env:BUILD_OUTPUT -HostBuildDir $env:HOST_BUILD_OUTPUT -OnlineBuildDir $env:ONLINE_BUILD_OUTPUT -ReleaseOutput $env:RELEASE_OUTPUT -PagesOutput $env:PAGES_OUTPUT -Version $env:VERSION -Repository '${{ github.repository }}'
        ./Scripts/Assert-ShippingPayload.ps1 -PayloadPath $env:BUILD_OUTPUT
        ./Scripts/Assert-ShippingPayload.ps1 -PayloadPath $env:ONLINE_BUILD_OUTPUT

    - name: Prepare Electron installer payloads
      shell: pwsh
      run: |
        # Stage the final Full and Online win-unpacked trees before wrapping
        # them so every executable embedded in the release can be signed.
        ./Scripts/Build-ElectronInstaller.ps1 `
          -Version $env:VERSION `
          -InstallerOutput $env:INSTALLER_OUTPUT `
          -PayloadOutput $env:INSTALLER_PAYLOAD_OUTPUT `
          -PreparePayloadsOnly

    - name: Sign Electron installer payloads
      if: ${{ env.RELEASE_SKIP_SIGNING != 'true' }}
      uses: azure/trusted-signing-action@v0.5
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        files-folder: ${{ env.INSTALLER_PAYLOAD_OUTPUT }}
        files-folder-filter: exe,dll
        files-folder-recurse: true
        files-folder-depth: 2
        append-signature: true
        batch-size: 10000
        timeout: 900

    - name: Verify Electron installer payload signatures
      if: ${{ env.RELEASE_SKIP_SIGNING != 'true' }}
      shell: pwsh
      run: ./Scripts/Assert-AuthenticodeSignatures.ps1 -Path $env:INSTALLER_PAYLOAD_OUTPUT

    - name: Prepare Electron installer shell
      shell: pwsh
      run: |
        # The portable wrapper extracts this shell and the installer copies it
        # as uninstall.exe, so it must be signed before the wrapper is built.
        ./Scripts/Build-ElectronInstaller.ps1 `
          -Version $env:VERSION `
          -InstallerOutput $env:INSTALLER_OUTPUT `
          -PayloadOutput $env:INSTALLER_PAYLOAD_OUTPUT `
          -PrepareInstallerShellOnly

    - name: Sign Electron installer shell
      if: ${{ env.RELEASE_SKIP_SIGNING != 'true' }}
      uses: azure/trusted-signing-action@v0.5
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        files: ${{ github.workspace }}\${{ env.INSTALLER_PAYLOAD_OUTPUT }}\nsis\elevate.exe
        files-folder: ${{ env.INSTALLER_PAYLOAD_OUTPUT }}\installer-shell
        files-folder-filter: exe,dll
        files-folder-recurse: false
        append-signature: true
        batch-size: 10000
        timeout: 900

    - name: Verify Electron installer shell signatures
      if: ${{ env.RELEASE_SKIP_SIGNING != 'true' }}
      shell: pwsh
      run: |
        ./Scripts/Assert-AuthenticodeSignatures.ps1 -Path "$env:INSTALLER_PAYLOAD_OUTPUT\installer-shell"
        ./Scripts/Assert-AuthenticodeSignatures.ps1 -Path "$env:INSTALLER_PAYLOAD_OUTPUT\nsis\elevate.exe"

    - name: Build Electron installer
      shell: pwsh
      run: |
        ./Scripts/Build-ElectronInstaller.ps1 `
          -Version $env:VERSION `
          -InstallerOutput $env:INSTALLER_OUTPUT `
          -PayloadOutput $env:INSTALLER_PAYLOAD_OUTPUT `
          -PackagePreparedPayloads

    - name: Sign installers
      if: ${{ env.RELEASE_SKIP_SIGNING != 'true' }}
      uses: azure/trusted-signing-action@v0.5
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        files-folder: ${{ env.INSTALLER_OUTPUT }}
        files-folder-filter: exe
        files-folder-recurse: true

    - name: Verify installer signatures
      if: ${{ env.RELEASE_SKIP_SIGNING != 'true' }}
      shell: pwsh
      run: ./Scripts/Assert-AuthenticodeSignatures.ps1 -Path $env:INSTALLER_OUTPUT

    - name: Verify final Electron footprint
      shell: pwsh
      run: |
        $auditor = 'Apps/Electron/scripts/package-footprint.mjs'
        node $auditor --app "$env:INSTALLER_PAYLOAD_OUTPUT\full" --rid win-x64
        if ($LASTEXITCODE -ne 0) { throw 'Full Electron payload footprint audit failed after signing.' }
        node $auditor --app "$env:INSTALLER_PAYLOAD_OUTPUT\online" --rid win-x64
        if ($LASTEXITCODE -ne 0) { throw 'Online Electron payload footprint audit failed after signing.' }
        node $auditor `
          "$env:INSTALLER_OUTPUT\UniversalDeviceToolkitSetup.exe" `
          "$env:INSTALLER_OUTPUT\UniversalDeviceToolkitOnlineSetup.exe" `
          "$env:INSTALLER_OUTPUT\$env:ZIP_FULL_ASSET" `
          "$env:INSTALLER_OUTPUT\$env:ZIP_ONLINE_ASSET"
        if ($LASTEXITCODE -ne 0) { throw 'Final Electron installer artifact footprint audit failed after signing.' }

    - name: Publish cross-platform CLI asset
      if: ${{ env.ENABLE_CROSS_PLATFORM_CLI == 'true' }}
      shell: pwsh
      run: |
        ./Scripts/Build-CrossPlatformCliAsset.ps1 `
          -Version $env:BUILD_VERSION `
          -AssetVersion $env:VERSION `
          -ReleaseOutput $env:RELEASE_OUTPUT `
          -SkipHashUpdate

    - name: Finalize release assets
      shell: pwsh
      run: |
        $finalizeArgs = @{
          FinalizeOnly = $true
          ReleaseOutput = $env:RELEASE_OUTPUT
          PagesOutput = $env:PAGES_OUTPUT
          Version = $env:VERSION
          FullInstallerPath = "$env:INSTALLER_OUTPUT\UniversalDeviceToolkitSetup.exe"
          OnlineInstallerPath = "$env:INSTALLER_OUTPUT\UniversalDeviceToolkitOnlineSetup.exe"
          FullZipPath = "$env:INSTALLER_OUTPUT\$env:ZIP_FULL_ASSET"
          OnlineZipPath = "$env:INSTALLER_OUTPUT\$env:ZIP_ONLINE_ASSET"
          Repository = '${{ github.repository }}'
        }

        if ($env:ENABLE_CROSS_PLATFORM_CLI -eq 'true') {
          $finalizeArgs['IncludeCrossPlatformCli'] = $true
        }

        ./Scripts/Build-LanguageAssets.ps1 @finalizeArgs

    - name: Validate package manifests
      if: ${{ env.RELEASE_IS_PRERELEASE != 'true' }}
      shell: pwsh
      run: |
        $releaseDate = [DateTime]::UtcNow.ToString('yyyy-MM-dd', [System.Globalization.CultureInfo]::InvariantCulture)
        ./Packaging/Prepare-PackageManifests.ps1 `
          -Version $env:BUILD_VERSION `
          -ReleaseDate $releaseDate `
          -HashManifestPath "$env:RELEASE_OUTPUT\$env:HASH_ASSET" `
          -UpdatePublishedScoopManifest

        ./Packaging/Test-PackageManifests.ps1 `
          -Version $env:BUILD_VERSION `
          -Repository '${{ github.repository }}' `
          -HashManifestPath "$env:RELEASE_OUTPUT\$env:HASH_ASSET"

        if (Get-Command winget -ErrorAction SilentlyContinue) {
          winget validate "Packaging\winget\manifests\s\SSC-STUDIO\UniversalDeviceToolkit\$env:BUILD_VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw "winget manifest validation failed."
          }
        }
        else {
          Write-Warning "winget is not available on this runner; skipped winget schema validation."
        }

    - name: Generate release notes
      shell: pwsh
      run: |
        $assetNames = @(
          $env:SETUP_FULL_ASSET,
          $env:SETUP_ONLINE_ASSET,
          $env:ZIP_FULL_ASSET,
          $env:ZIP_ONLINE_ASSET,
          $env:HASH_ASSET
        )
        if ($env:ENABLE_CROSS_PLATFORM_CLI -eq 'true') {
          $assetNames += $env:CLI_CROSS_PLATFORM_ASSET
        }

        ./Scripts/New-ReleaseNotes.ps1 `
          -Version $env:BUILD_VERSION `
          -ChangelogPath 'CHANGELOG.md' `
          -AssetNames $assetNames `
          -ProductName 'Universal Device Toolkit' `
          -OutputPath (Join-Path $PWD "$env:RELEASE_OUTPUT\release-notes.md")

    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        name: Universal Device Toolkit v${{ env.VERSION }}
        tag_name: ${{ env.RELEASE_TAG }}
        files: |
          release-assets/*.exe
          release-assets/*.zip
          release-assets/*_SHA256.txt
        fail_on_unmatched_files: true
        prerelease: ${{ env.RELEASE_IS_PRERELEASE == 'true' }}

    - name: Apply release notes (UTF-8)
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $notesPath = Join-Path $PWD "$env:RELEASE_OUTPUT/release-notes.md"
        if (-not (Test-Path -LiteralPath $notesPath)) {
          throw "Release notes file not found at $notesPath"
        }

        gh release edit "$env:RELEASE_TAG" `
          --repo "${{ github.repository }}" `
          --notes-file $notesPath

    # Do not deploy GitHub Pages from Release. pages.yml owns the live site;
    # a second deploy-pages here would replace that artifact and 404 catalogs.
    # Language-pack resources are still generated and uploaded as a regular
    # artifact for the Pages workflow to assemble.

    - name: Upload release artifact
      uses: actions/upload-artifact@v7
      with:
        name: release-assets-v${{ env.VERSION }}
        path: release-assets/

    - name: Upload Pages resources artifact
      uses: actions/upload-artifact@v7
      with:
        name: pages-resources-v${{ env.VERSION }}
        path: release-assets/pages/
