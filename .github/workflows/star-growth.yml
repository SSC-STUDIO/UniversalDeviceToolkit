name: Star Growth Tracker

on:
  schedule:
    # Mondays 06:00 UTC (Asia/Shanghai Monday 14:00)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: star-growth
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Post weekly star digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          title="Star Growth Tracker"
          goal=100
          digest_path="$RUNNER_TEMP/udt-star-digest.md"

          stars=$(gh api "repos/$REPO" --jq .stargazers_count)
          forks=$(gh api "repos/$REPO" --jq .forks)
          watchers=$(gh api "repos/$REPO" --jq .subscribers_count)
          latest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || echo none)

          remaining=$(( goal - stars ))
          if [ "$remaining" -gt 0 ]; then
            phase="Chinese outreach (0-100)"
            next="Publish the prepared Bilibili and V2EX maintainer posts when access is available; respond to actual HelloGitHub #3383 review feedback. Record published URLs in Docs/Promotion/SUBMISSIONS.md; copy is in Docs/Promotion/PROMOTION_CN.md."
          else
            remaining=0
            phase="100-star goal reached"
            next="Record the milestone and conclude this campaign. Keep answering user feedback; do not start a larger growth campaign automatically."
          fi

          pct=$(( stars * 100 / goal ))
          if [ "$pct" -gt 100 ]; then pct=100; fi
          bar_len=$(( pct / 5 ))
          if [ "$bar_len" -gt 20 ]; then bar_len=20; fi
          bar=""
          i=0
          while [ "$i" -lt "$bar_len" ]; do bar="${bar}#"; i=$((i+1)); done

          milestone=""
          for m in 30 50 75 100; do
            if [ "$stars" -ge "$m" ]; then milestone="$milestone :white_check_mark: $m"; else milestone="$milestone :white_large_square: $m"; fi
          done

          issue_num=$(gh api -X GET "search/issues?q=repo:$REPO+is:issue+is:open+in:title+${title// /+}" --jq '.items[0].number // empty' 2>/dev/null || echo "")

          delta=""
          if [ -n "$issue_num" ]; then
            last_body=$(gh api --paginate --slurp "repos/$REPO/issues/$issue_num/comments" --jq '.[-1][-1].body // ""')
            if [ -z "$last_body" ]; then
              last_body=$(gh api "repos/$REPO/issues/$issue_num" --jq '.body // ""')
            fi
            prev=$(printf '%s' "$last_body" | grep -oE 'udt-stars=[0-9]+' | tail -1 | cut -d= -f2 || echo "")
            if [ -n "$prev" ]; then
              d=$(( stars - prev ))
              if [ "$d" -ge 0 ]; then delta=" (+$d since last digest)"; else delta=" ($d since last digest)"; fi
            fi
          fi

          stamp=$(date -u +"%Y-%m-%d %H:%M UTC")
          {
            echo "### Star Growth Digest -- $stamp"
            echo ""
            echo "- **Stars:** \`$stars\`$delta  | forks \`$forks\`  watching \`$watchers\`  latest release \`$latest\`"
            echo "- **Progress to $goal stars:** ${pct}% \`[$bar]\` | **Remaining:** $remaining"
            echo "- **Milestones:**$milestone"
            echo "- **Current phase:** $phase"
            echo "- **Next priority action:** $next"
            echo ""
            echo "_Auto-posted by the star-growth workflow (Actions tab) every Monday. Edit or disable it there._"
            echo "<!-- udt-stars=$stars -->"
          } > "$digest_path"

          if [ -z "$issue_num" ]; then
            gh issue create --repo "$REPO" --title "$title" --label "star-tracker" --body-file "$digest_path" 2>/dev/null \
              || gh issue create --repo "$REPO" --title "$title" --body-file "$digest_path"
          else
            gh issue comment "$issue_num" --repo "$REPO" --body-file "$digest_path"
          fi
