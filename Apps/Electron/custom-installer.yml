appId: com.universaldevicetoolkit.installer
productName: Universal Device Toolkit Setup
copyright: Universal Device Toolkit Contributors
directories:
  output: dist/custom-installer
  buildResources: buildResources
files:
  - installer/**
  - package.json
extraResources:
  - from: resources/icon.png
    to: installer-assets/icon.png
  - from: dist/win-unpacked
    to: payload
    filter:
      - "**/*"
win:
  icon: buildResources/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: UniversalDeviceToolkitSetup-${version}.${ext}
  requestExecutionLevel: user
compression: normal
# The installer shell has no Chromium-localized UI; its own copy of Electron
# only needs the fallback locale. The embedded application payload retains its
# independently audited 24 Chromium locales.
electronLanguages:
  - en-US
asar: true
beforeBuild: ./scripts/installer-builder-hooks.mjs
extraMetadata:
  main: installer/main.mjs
